<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <!-- Arka plan siyah daire -->
  <circle cx="50" cy="50" r="50" fill="black" />
  
  <!-- Orijinal logodaki kalın halka ve sol-alt paralel kesit (Turuncu #F97316) -->
  <circle
    cx="50"
    cy="50"
    r="36"
    fill="none"
    stroke="#F97316"
    strokeWidth="14"
    strokeDasharray="200 26"
    transform="rotate(135 50 50)"
  />
  
  <!-- Merkezdeki turuncu nokta -->
  <circle cx="50" cy="50" r="11" fill="#F97316" />
</svg>
